name: Porters
description: Porters is an AI-native outsourcing partner for European banking operations. Its platform
  uses AI agents with human oversight to automate high-volume back-office banking processes — account
  seizure processing (private and public account seizures), insolvency case management from intake to
  resolution, and chargeback dispute data collection, triage, and resolution. Documents are ingested,
  extracted, and classified; decisions are made with a human in the loop; and banking actions plus audit
  reports are generated automatically. Porters hosts data in the EU in line with GDPR, maintains 24/7
  audit trails, and does not use customer data for model training. It was founded by veterans of
  McKinsey, Qonto, Upvest, Solaris, and Roland Berger, and is backed by Earlybird and Seedcamp. No
  public developer API is currently published.
